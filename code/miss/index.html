<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miss Page</title>
    <link rel="stylesheet" href="style.css">

<body>
    <h1>Hello from HTML in miss!</h1>

    <div class="weui-cells__title">WeUI Example</div>
    <div class="weui-cells">
        <div class="weui-cell">
            <div class="weui-cell__bd">
                <a href="javascript:;" class="weui-btn weui-btn_primary" id="weuiButton">点击我</a>
            </div>
        </div>

    <div class="weui-cells__title">jQuery UI Datepicker Example</div>

        <div class="weui-cell">
            <div class="weui-cell__hd"><label for="datePicker" class="weui-label">选择日期</label></div>
            <div class="weui-cell__bd">
                <input class="weui-input" type="text" id="datePicker" placeholder="请选择日期">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
